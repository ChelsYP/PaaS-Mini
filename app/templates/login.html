{% extends "base.html" %}

{% block title %}Masuk{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex flex-col justify-center items-center px-4">
  <div class="w-full max-w-sm">
    
    <!-- Header Logo & Subtitle -->
    <div class="text-center mb-6">
      <div class="inline-flex w-10 h-10 rounded-lg bg-zinc-900 border border-zinc-700 items-center justify-center text-zinc-100 mb-3 shadow-sm">
        <svg class="w-5 h-5 text-zinc-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
      </div>
      <h1 class="text-lg font-semibold text-zinc-100 tracking-tight">PaaS Mini</h1>
      <p class="text-xs text-zinc-400 mt-1">Platform Hosting Mandiri Berbasis Kontainer</p>
    </div>

    <!-- Alert Error Box (Jika Kredensial Salah) -->
    {% if error %}
    <div class="mb-4 p-3 rounded-md bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs flex items-center space-x-2">
      <svg class="w-4 h-4 shrink-0 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Card Form Login -->
    <div class="bg-zinc-900/90 border border-zinc-800 rounded-lg p-6 shadow-xl">
      <form action="/login" method="POST" class="space-y-4">
        
        <div>
          <label for="username" class="block text-xs font-medium text-zinc-300 mb-1.5">
            Nama Pengguna
          </label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            required 
            autofocus 
            autocomplete="username"
            placeholder="admin" 
            class="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-md text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-colors"
          >
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-xs font-medium text-zinc-300">
              Kata Sandi
            </label>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            autocomplete="current-password"
            placeholder="••••••••" 
            class="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-md text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-colors font-mono"
          >
        </div>

        <button 
          type="submit" 
          class="w-full py-2 px-3 rounded-md bg-zinc-100 hover:bg-white text-zinc-950 text-xs font-medium transition-colors shadow-sm flex items-center justify-center space-x-2 mt-2"
        >
          <span>Masuk ke Dashboard</span>
          <svg class="w-3.5 h-3.5 text-zinc-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

      </form>
    </div>

    <div class="mt-6 text-center text-[11px] font-mono text-zinc-600 space-y-1">
      <p>Akses internal &bull; dashboard.paas.local</p>
      <p class="text-[10px] text-zinc-700">Autentikasi terenkripsi via bcrypt + HTTP-only session cookie</p>
    </div>

  </div>
</div>
{% endblock %}
