<!-- Fragmen Toast HTMX: app/templates/partials/toast.html -->
<div 
  class="pointer-events-auto flex items-center justify-between p-3 rounded-md bg-zinc-900 border {% if is_error %}border-rose-600/40 text-rose-300{% else %}border-zinc-700 text-zinc-200{% endif %} shadow-2xl max-w-sm text-xs transition-all"
  id="toast-item"
>
  <div class="flex items-center space-x-2">
    {% if is_error %}
    <svg class="w-4 h-4 text-rose-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    {% else %}
    <svg class="w-4 h-4 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    {% endif %}
    <span>{{ message }}</span>
  </div>
  <button onclick="this.closest('#toast-item').remove()" class="text-zinc-500 hover:text-zinc-300 ml-3 font-mono">✕</button>
</div>
